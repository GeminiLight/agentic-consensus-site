<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Agentic Consensus share card</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card {
        padding: 48px 62px;
        height: 630px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-top .brand {
        font-size: 21px;
        gap: 14px;
      }
      .card-top .brand img {
        width: 42px;
        height: 42px;
      }
      .card-top > span {
        font: 11px var(--mono);
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .card h1 {
        font-size: 96px;
        line-height: 1.04;
        margin-top: 61px;
        letter-spacing: -0.035em;
      }
      .card h1 em {
        color: var(--green);
      }
      .card-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      .chain {
        display: flex;
        gap: 20px;
        align-items: center;
        font-size: 14px;
      }
      .chain i {
        font-style: normal;
        color: #8f9f81;
      }
      .card-bottom > span {
        font: 11px var(--mono);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-top">
        <span class="brand"
          ><img src="../assets/mark.svg" alt="" />Agentic Consensus</span
        ><span>HUMAN + AGENT COLLABORATION</span>
      </div>
      <h1>Build with agents.<br />Keep the project <em>understood.</em></h1>
      <div class="card-bottom">
        <div class="chain">
          <span>Intent</span><i>→</i><span>Commitments</span><i>→</i
          ><span>Code</span><i>→</i><span>Evidence</span>
        </div>
        <span>Research &amp; open-source software</span>
      </div>
    </div>
  </body>
</html>
